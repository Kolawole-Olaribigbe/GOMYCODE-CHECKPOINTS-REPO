services:
  backend:
    build: .
    container_name: compose-backend
    networks: 
      - app-network

  nginx:
    image: nginx:alpine
    container_name: compose-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
